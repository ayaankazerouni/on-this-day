    # About

    Just for fun, a little map of Wikipedia's On This Day Events.
    [Here's the code.](https://github.com/ayaankazerouni/on-this-day)

    The map shows two types of data, each with its own caveats:

    ## "On this day" events

    From the Wikimedia `onthisday` Feed API.

    Each event was mapped to _zero or more locations_ and _a Wikipedia page_ according to some heuristics.
    Each event comes with several pages linked — possibly one of those pages is "about the event", and some of them include coordinates.
    I used [Wikidata](https://wikidata.org/)'s knowledge base to guess which page would best describe the event, and the page(s) that would best place it on the map.

    If an event could not be placed on the map at all, it was dropped, since this is, after all, a map of events.

    ## Historical borders

    Provided by André Ourednik ([`aourednik/historical-basemaps`](https://github.com/aourednik/historical-basemaps)).
    When an event is selected, map borders update to the closest available map (though note that the "closest map" might be from decades or centuries before or after the event).
    For example, if we select the [Battle of Morgarten](https://en.wikipedia.org/wiki/Battle_of_Morgarten) on November 15, 1315 CE, it's useful to also see that it took place in what was then the Holy Roman Empire, and perhaps also that successor khanates of the Mongol Empire were contemporaneous.

    When borders are drawn, a note beneath the map gives the range of years for which the drawn basemap stands in (those years for which it is the closest available map).

    In their README, Ourednik emphasises:

    > When using the data, keep in mind that
    > * historical boundaries are even more disputed than contemporary ones, that
    > * the actual concept of territory and national boundary becomes meaningful, in Europe, only since the [Peace of Westphalia](https://en.wikipedia.org/wiki/Peace_of_Westphalia) (1648), that
    > * areas of civilizations actually overlap, especially in ancient history, and that
    > * overlaying these ancient vector maps on contemporary physical maps can be misleading; rivers, lakes, shorelines _do_ change very much over millennia; think for instance about the evolution of the [Aral Sea](https://en.wikipedia.org/wiki/Aral_Sea) since the 1980s.
